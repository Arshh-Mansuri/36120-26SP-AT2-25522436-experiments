[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "weather_experiments"
version = "0.0.1"
description = "AT2 experiments: Climate Comfort Index and Weather Hazard Category forecasting for Sydney"
authors = [
  { name = "Arsh Ashfaqhusein Mansuri" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipykernel",
    "ipython",
    "joblib",
    "jupyterlab",
    "lightgbm",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow",
    "pytest",
    "python-dotenv",
    "requests",
    "ruff",
    "scikit-learn",
    "seaborn",
    "shiftguard>=0.2.0",
    "statsmodels",
    "tqdm",
    "typer",
    "xgboost",
]
requires-python = "~=3.12.0"

[tool.uv.sources]
shiftguard = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true


[tool.ruff]
line-length = 99
src = ["weather_experiments"]
include = ["pyproject.toml", "weather_experiments/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["weather_experiments"]
force-sort-within-sections = true

